<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MT5 Copy Bridge</title>
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<!-- Khong co chuoi tieng Viet nao trong file nay. Moi nhan do /api gui xuong tu
     bridge/labels_vi.py (D-16), nen doi cach goi mot khai niem chi phai sua mot cho. -->
<header id="thanh-trang-thai">
  <span id="app-title"></span>
  <span id="run-mode" class="badge"></span>
  <!-- Ba nut doi che do nam NGAY CANH nhan trang thai, tren moi man hinh. Truoc day chung nam
       cuoi tab Tong quan, duoi bang cap lenh: co bang dai la chung tut xuong duoi man hinh va
       nguoi van hanh khong tim thay thu can bam nhat. -->
  <span id="dieu-khien-mode">
    <button id="nut-pause-new"></button>
    <button id="nut-stop-sync"></button>
    <button id="nut-resume" class="chinh"></button>
  </span>
  <span id="agents"></span>
  <span id="dong-ho"></span>
</header>

<nav>
  <button data-man="tong-quan" class="tab active"></button>
  <button data-man="huong-dan" class="tab"></button>
  <button data-man="sai-lech" class="tab"></button>
  <button data-man="cau-hinh" class="tab"></button>
  <button data-man="nhat-ky" class="tab"></button>
</nav>

<main>
  <section id="tong-quan" class="man">
    <div id="chi-so" class="o-chi-so"></div>
    <h2 id="tieu-de-cap"></h2>
    <table id="bang-cap"><thead><tr id="dau-bang"></tr></thead><tbody></tbody></table>

  </section>

  <!-- Huong dan tung buoc. Cai dat xong, script mo san /#huong-dan, nen day thuong la trang
       dau tien nguoi dung nhin thay. -->
  <section id="huong-dan" class="man an">
    <h2 id="tieu-de-huong-dan"></h2>
    <div id="noi-dung-huong-dan"></div>
  </section>

  <section id="sai-lech" class="man an">
    <h2 id="tieu-de-sai-lech"></h2>
    <div id="nhom-safe"></div>
    <div id="nhom-decision"></div>
    <p id="khong-sai-lech" class="trong"></p>
  </section>

  <section id="cau-hinh" class="man an">
    <h2 id="tieu-de-cau-hinh"></h2>
    <div id="noi-dung-cau-hinh"></div>
  </section>

  <section id="nhat-ky" class="man an">
    <h2 id="tieu-de-nhat-ky"></h2>
    <div id="danh-sach-alert"></div>
  </section>
</main>

<!-- Token hien trong mot hop rieng, khong phai mot khoi chen vao trang: no la thu PHAI chep
     xong moi di tiep, nen no phai chan duong di cho toi luc do. Ban cu chen vao dau tab Cau hinh
     va bi chinh lan ve lai tab do xoa mat. -->
<dialog id="hop-token">
  <h3 id="token-tieu-de"></h3>
  <p id="token-canh-bao" class="canh-bao-nho"></p>
  <pre id="token-gia-tri" class="lenh"></pre>
  <div>
    <button id="token-chep" class="chinh"></button>
    <button id="token-dong"></button>
  </div>
</dialog>

<dialog id="hop-xac-nhan">
  <p id="xac-nhan-loi"></p>
  <input id="xac-nhan-go" type="text" autocomplete="off">
  <div>
    <button id="xac-nhan-huy"></button>
    <button id="xac-nhan-ok" class="nguy-hiem"></button>
  </div>
</dialog>

<script src="/static/app.js"></script>
</body>
</html>
