# Mẫu cấu hình. Sao chép thành `config.toml` rồi điền giá trị thật.
# `config.toml` nằm trong .gitignore, `config.example.toml` thì được commit.
#
# Cac khoa duoi day sua duoc tren dashboard (tab Cau hinh): noi dung moi duoc kiem bang dung
# phep kiem cua lan khoi dong TRUOC khi ghi, ban cu duoc sao luu thanh
# config.toml.bak-<ngay-gio> (giu 5 ban). Gia tri moi CHI co hieu luc sau
# `.\scripts\khoi-dong-lai.ps1`.

[bridge]
# Chi nghe loopback. Doi thanh "0.0.0.0" de agent may khac noi toi duoc — khi do
# BAT BUOC phai dat dashboard_password, neu khong Bridge tu choi khoi dong.
host = "127.0.0.1"
port = 8787
web_port = 8080
db_path = "data/bridge.db"

[security]
# Token thật đặt trong config.toml, file này nằm trong .gitignore
dashboard_password = ""

# Kenh canh bao ngoai (plan 10.4). Thieu hai muc nay thi kenh im lang, khong loi.
# Chi alert muc ERROR va CRITICAL moi duoc gui ra; INFO/WARNING o lai trong dashboard.
telegram_token = ""
telegram_chat_id = ""

# TOKEN cua tien trinh clicker (`python -m clicker`). Dat o day thay vi tren dong lenh: dong lenh
# cua mot tien trinh la thu moi tai khoan tren cung may doc duoc bang `Get-CimInstance
# Win32_Process`, va clicker chay 24/7 nen token se phoi ra suot ngay.
# Thu tu uu tien: --token > bien moi truong COPYBRIDGE_CLICKER_TOKEN > muc nay.
[clicker]
token = ""

# Clicker THU HAI, lai terminal MASTER (phase 12). Chi can khi bat `master_close_route = UI` de
# deal DONG tren tai khoan Master cung mang DEAL_REASON = CLIENT. De trong thi khong chay clicker
# nay, va lenh dong Master di duong OrderSend cua EA nhu cu.
# Chay bang: python -m clicker --muc clicker_master
[clicker_master]
token = ""

# SO TAI KHOAN va TIEU DE CUA SO cua clicker KHONG con o day (D-32): chung nam trong database va
# khai tren dashboard, tab Cau hinh > Agent. Clicker nhan chung tu Bridge moi lan bat tay, nen doi
# terminal la sua tren dashboard chu khong phai sua file nay roi dang ky lai Scheduled Task.
#
# BAN CAI CU co san hai khoa nay: XOA chung di sau khi nang cap, neu khong thi sua tren
# dashboard khong co tac dung (FILE THANG DATABASE) va khong script nao kiem ho.
#
# Van khai duoc o day khi ban co ly do cu the:
#   [clicker]
#   account_login  = 538217
#   terminal_title = "538217"
